name: Integration tests 1.0
on:
  workflow_dispatch:
    inputs:
      database:
        description: 'Database override'
        required: false
        default: ''
      engine:
        description: 'Engine override'
        required: false
  workflow_call:
    inputs:
      database:
        description: 'Database override'
        required: false
        default: ''
        type: string
      engine:
        description: 'Engine override'
        required: false
        type: string
        
    secrets:
      FIREBOLT_STG_USERNAME:
        required: true
      FIREBOLT_STG_PASSWORD:
        required: true
        
permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8.0 SDK and .NET 6.0
        id: dotnet-setup
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The test project targets net6.0, so it needs the 6.0 runtime; build with the
          # 8.0 SDK (the dotnet-version output is the latest installed SDK).
          dotnet-version: |
            6.0.x
            8.0.x

      - name: use .NET 8.0 SDK
        env:
          DOTNET_VERSION: ${{ steps.dotnet-setup.outputs.dotnet-version }}
        run: |
          dotnet new globaljson --sdk-version "$DOTNET_VERSION"

      - name: Install dependencies
        run: |
          dotnet restore

      - name: Setup database and engine
        if: ${{ inputs.database == '' }}
        id: setup
        uses: firebolt-db/integration-testing-setup@eb35b7719247c93392cb3a8aa4f554a4c11a770b # v1.0.3
        with:
          firebolt-username: ${{ secrets.FIREBOLT_STG_USERNAME }}
          firebolt-password: ${{ secrets.FIREBOLT_STG_PASSWORD }}
          api-endpoint: "api.staging.firebolt.io"
          region: "us-east-1"
          instance-type: "B2"

      - name: Determine database name
        id: find-database-name
        env:
          INPUT_DATABASE: ${{ inputs.database }}
          SETUP_DATABASE: ${{ steps.setup.outputs.database_name }}
        run: |
          if ! [[ -z "$INPUT_DATABASE" ]]; then
              echo "database_name=$INPUT_DATABASE" >> "$GITHUB_OUTPUT"
          else
              echo "database_name=$SETUP_DATABASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine engine name
        id: find-engine-name
        env:
          INPUT_ENGINE: ${{ inputs.engine }}
          SETUP_ENGINE: ${{ steps.setup.outputs.engine_name }}
        run: |
          if ! [[ -z "$INPUT_ENGINE" ]]; then
              echo "engine_name=$INPUT_ENGINE" >> "$GITHUB_OUTPUT"
          else
              echo "engine_name=$SETUP_ENGINE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration tests
        env:
          FIREBOLT_ENV: staging
          FIREBOLT_DATABASE: ${{ steps.setup.outputs.database_name }}
          FIREBOLT_ENGINE_NAME: ${{ steps.setup.outputs.engine_name }}
          FIREBOLT_ENDPOINT: "api.staging.firebolt.io"
          FIREBOLT_USERNAME: ${{ secrets.FIREBOLT_STG_USERNAME }}
          FIREBOLT_PASSWORD: ${{ secrets.FIREBOLT_STG_PASSWORD }}
        run: |
          dotnet test --filter 'Category=Integration&(Category=v1|Category=general)&Name!=ExecuteLongTest' -l "console;verbosity=normal"

