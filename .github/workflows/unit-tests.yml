# This workflow will install Python dependencies, run pre-commit checks, and run tests with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit tests

on:
  workflow_call:
  push:
    branches: [ main, 0.x ]

permissions: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    
    - name: Set up .NET 8.0 SDK and .NET 6.0
      id: dotnet-setup
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        # The test project targets net6.0, so it needs the 6.0 runtime; build with the
        # 8.0 SDK (the dotnet-version output is the latest installed SDK).
        dotnet-version: |
          6.0.x
          8.0.x

    - name: use .NET 8.0 SDK
      env:
        DOTNET_VERSION: ${{ steps.dotnet-setup.outputs.dotnet-version }}
      run: |
        dotnet new globaljson --sdk-version "$DOTNET_VERSION"

    - name: Install coverage tool
      run: dotnet tool install --global dotnet-coverage --version 17.12.6

    - name: Install dependencies
      run: |
        dotnet restore

    - name: Run unit tests
      run: |
        mkdir -p coverage
        dotnet-coverage collect 'dotnet test --filter "Category!=Integration" --logger trx' -f xml -o "coverage/coverage.xml"

    - name: Upload test artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-artifacts
        path: |
          **/TestResults/*.trx
          coverage/coverage.xml