name: Release new version

on:
  workflow_dispatch:
    inputs:
      tag_version:
        required: true
        description: 'Release tag to use (e.g. 1.2.3)'

permissions: {}

jobs:
  integration-tests:
    uses: ./.github/workflows/integration-tests.yml
    permissions:
      contents: read
    secrets:
      FIREBOLT_STG_USERNAME: ${{ secrets.FIREBOLT_STG_USERNAME }}
      FIREBOLT_STG_PASSWORD: ${{ secrets.FIREBOLT_STG_PASSWORD }}
      FIREBOLT_CLIENT_ID_STG_NEW_IDN: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
      FIREBOLT_CLIENT_SECRET_STG_NEW_IDN: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
      ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_ID_STG: ${{ secrets.ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_ID_STG }}
      ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_SECRET_STG: ${{ secrets.ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_SECRET_STG }}

  publish:
    runs-on: ubuntu-latest
    permissions:
      # Creates/updates the GitHub release with GITHUB_TOKEN.
      contents: write
    needs: integration-tests
    outputs:
      release_tag: ${{ steps.sanitize.outputs.value }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_FB_DB_CI_WRITER_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_FB_DB_CI_WRITER_APP_KEY_PEM }}
          permission-contents: write

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # The release steps push the version bump commit and tag.
          persist-credentials: true

      - name: Setup git config
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
        shell: bash

      - name: Sanitize tag_version
        id: sanitize
        env:
          RELEASE_TAG: ${{ inputs.tag_version }}
        shell: bash
        run: |
          RAW="$RELEASE_TAG"
          # strip optional leading 'v'/'V'
          SANITIZED="${RAW#v}"; SANITIZED="${SANITIZED#V}"
          if [ -z "$SANITIZED" ]; then
            echo "Sanitized tag_version is empty"; exit 1
          fi
          echo "value=$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Version bump
        env:
          VERSION: ${{ steps.sanitize.outputs.value }}
        run: |
          sed -i "s/^    <FileVersion>.*<\/FileVersion>/    <FileVersion>${VERSION}<\/FileVersion>/" FireboltNETSDK/FireboltDotNetSdk.csproj
          sed -i "s/^    <AssemblyVersion>.*<\/AssemblyVersion>/    <AssemblyVersion>${VERSION}<\/AssemblyVersion>/" FireboltNETSDK/FireboltDotNetSdk.csproj
          sed -i "s/^    <Version>.*<\/Version>/    <Version>${VERSION}<\/Version>/" FireboltNETSDK/FireboltDotNetSdk.csproj
          git branch
          git diff
          git add FireboltNETSDK/FireboltDotNetSdk.csproj
          git commit -m "Automatic version bump to ${VERSION}"
          git push origin main
        shell: bash
        
      - name: Publish tag on github
        env:
          VERSION: ${{ steps.sanitize.outputs.value }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
        shell: bash

      - name: Set up .NET 8.0
        id: dotnet-setup
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0
          
      - name: use .NET 8.0
        env:
          DOTNET_VERSION: ${{ steps.dotnet-setup.outputs.dotnet-version }}
        run: |
          dotnet new globaljson --sdk-version "$DOTNET_VERSION"

      - name: Build package
        run: |
          dotnet restore
          dotnet build
          dotnet pack
        shell: bash

      - name: Publish package on Nuget
        env:
          PUBLISH_API_KEY: ${{ secrets.PUBLISH_API_KEY }}
          VERSION: ${{ steps.sanitize.outputs.value }}
        run: |
           dotnet nuget push "FireboltNETSDK/bin/Debug/FireboltNetSDK.${VERSION}.nupkg" \
            --api-key "$PUBLISH_API_KEY" \
            --source https://api.nuget.org/v3/index.json
        shell: bash

      - name: Generate and update GitHub release notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.sanitize.outputs.value }}
        with:
         github-token: ${{ secrets.GITHUB_TOKEN }}
         script: |
           const tag = process.env.RELEASE_TAG;
           const { owner, repo } = context.repo;
           
           // Try to fetch existing release by tag
           let release = null;
           try {
             const res = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
             release = res.data;
           } catch (err) {
             if (err.status !== 404) throw err;
           }
           
           // Generate notes based on PRs/commits between last release and this tag
           const notes = await github.rest.repos.generateReleaseNotes({ owner, repo, tag_name: tag });
           
           // Sanitize internal JIRA links: [FIR-1234](...) -> `FIR-1234`, and wrap bare FIR-1234 in backticks
           let body = notes.data.body || '';
           body = body.replace(/\[(FIR-\d+)\]\([^)]*\)/g, '`$1`');
           body = body.replace(/(?<!`)\bFIR-\d+\b(?!`)/g, (m) => `\`${m}\``);
           
           if (release) {
             await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body });
           } else {
             await github.rest.repos.createRelease({
               owner,
               repo,
               tag_name: tag,
               name: tag,
               body,
               draft: false,
               prerelease: false
             });
           }

  notify:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
    strategy:
      matrix:
        # convert the comma separated values into a json
        channel: ${{ fromJson(vars.RELEASE_NOTES_SLACK_CHANNELS) }}
    steps:
      - run: test -n "$SLACK_BOT_TOKEN" || (echo "SLACK_BOT_TOKEN is empty" && exit 1)

      - name: Notify Slack of Kafka Sink Connector
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ matrix.channel }}
            "text": "Firebolt .NET SDK ${{ env.RELEASE_TAG }} has been released: <https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}|Release notes>"