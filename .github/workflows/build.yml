name: Build

on:
  workflow_call:
  push:
    branches: [ main, 0.x ]

permissions: {}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    
    - name: Set up .NET 6.0
      id: dotnet-setup
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 6.0

    - name: use .NET 6.0
      env:
        DOTNET_VERSION: ${{ steps.dotnet-setup.outputs.dotnet-version }}
      run: |
        dotnet new globaljson --sdk-version "$DOTNET_VERSION"

    - name: Install dependencies
      run: |
        dotnet restore

    - name: Build project
      id: build
      run: |
        dotnet build
