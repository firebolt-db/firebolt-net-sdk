name: Pull request

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
  code-checkers:
    uses: ./.github/workflows/code-check.yml
    permissions:
      contents: read
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read
  sonar-scan:
    uses: ./.github/workflows/sonar-scan.yml
    permissions:
      contents: read
    needs: [build, unit-tests]
    secrets:
      SONARCLOUD_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
